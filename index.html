<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Template 3</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Estedad:wght@100..900&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="sideleft">
        <div class="links">
          <h5>Podcast</h5>
          <h5>Portfolio</h5>
          <h5>Research</h5>
          <h5>Clients</h5>
        </div>
      </div>
      <div class="left">
        <div class="about-tag">⁕ About Me</div>
        <div class="ring"></div>
        <div class="purple-circle"></div>
        <div class="img">
          <img src="./lefthero.png" alt="" />
        </div>
        <div class="content">
          <h3>Im,</h3>
          <h1>Jon<br />Daniel</h1>

          <p>inquiry@jondaniel.design</p>
        </div>
        <div class="logo">
          <div class="inner-logo">●</div>
        </div>
      </div>
      <div class="top-center">
        <h1>Portfolio</h1>
        <div class="shape"></div>
      </div>
      <div class="center-left">
        <div class="circle">
          <div class="play"><i class="ri-play-fill"></i></div>
        </div>
      </div>
      <div class="center-right">
        <div class="top">
          <div class="shape-varient"></div>
          <h3>251</h3>
          <h5>Projects</h5>
        </div>
        <div class="bottom">
          <div class="shape-varient"></div>
          <h3>156</h3>
          <h5>Awards</h5>
        </div>
      </div>
      <div class="left-bottom">
        <div class="shape-varient"></div>
        <img src="./apple.png" alt="client">
        <h4>Clients</h4>
      </div>
      <div class="right-bottom">
        <div class="left"><img src="./flow.png" alt="flow" /></div>
        <div class="right">
          <div class="shape-varient"></div>
          <h3>172</h3>
          <h6>Global Design</h6>
          <h5>Awards.</h5>
        </div>
      </div>
    </main>
  </body>
</html>
